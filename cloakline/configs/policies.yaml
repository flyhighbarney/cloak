schema_version: v1.0

policies:
  # 1. Client asked for a Claude model → route to Anthropic if present.
  - id: anthropic-by-model-v1
    api_version: v1.0
    kind: routing
    expression: |
      request.model.startsWith("claude")
        ? snapshot.candidates
            .filter(u, u["kind"] == "anthropic" && u["health"] == "healthy")
            .map(u, u["id"])[0]
        : ""

  # 2. Otherwise pick the first healthy OpenAI-shaped upstream (this covers
  #    both api.openai.com and Ollama, which speaks the same wire).
  - id: openai-default-v1
    api_version: v1.0
    kind: routing
    expression: |
      snapshot.candidates
        .filter(u, u["kind"] == "openai" && u["health"] == "healthy")
        .map(u, u["id"])[0]
