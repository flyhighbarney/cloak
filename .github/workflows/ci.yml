name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test + Vet + Race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "run 'go mod tidy' locally" && exit 1)

      - name: go vet
        run: go vet ./...

      - name: go build (all packages)
        run: go build ./...

      - name: go test with race detector
        run: go test -race -count=1 ./...

  build:
    name: Build binaries
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build policyd
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/policyd ./cmd/policyd
          file bin/policyd

      - name: Build policyctl
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/policyctl ./cmd/policyctl
          file bin/policyctl

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/
          retention-days: 7

  secret-audit:
    name: Log-leak audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reject anything that looks like a real cloud API key committed by
      # accident. Uses git grep so the check is deterministic and fast.
      - name: Refuse real cloud API keys in tracked files
        run: |
          set -e
          # Patterns for real cloud keys — sk-gw-* virtual keys are allowed.
          # We look for canonical prefixes with sufficient trailing entropy.
          PATTERNS=(
            'sk-proj-[A-Za-z0-9_-]{20,}'
            'sk-live-[A-Za-z0-9_-]{20,}'
            'sk-ant-api03-[A-Za-z0-9_-]{20,}'
            'AKIA[0-9A-Z]{16}'
            'ghp_[A-Za-z0-9]{36}'
            'xox[bpars]-[A-Za-z0-9-]{10,}'
          )
          FAILED=0
          for p in "${PATTERNS[@]}"; do
            if git grep -E "$p" -- . ':!:.github/workflows/ci.yml' ':!:docs/product-checklist.md' ':!:docs/threat-model.md' ':!:internal/dlp/patterns/patterns.go' ':!:internal/obs/log/log.go' ':!:internal/stage/dlptier1/dlp.go' 2>/dev/null; then
              echo "::error::pattern $p found in tracked files"
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            exit 1
          fi
          echo "✓ no cloud API keys found in tracked files"

      - name: Refuse .env files
        run: |
          if git ls-files | grep -E '^(\.env|\.env\..*)$' | grep -v '\.env\.example$'; then
            echo "::error::.env files must not be committed"
            exit 1
          fi
          echo "✓ no .env files tracked"

  vuln-scan:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
