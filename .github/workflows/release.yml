name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    # The Go module lives in cloakline/, not at the repository root. The workflow
    # file itself has to stay at the root: GitHub Actions only reads
    # .github/workflows/ from there, so a workflow moved into the project
    # directory does not fail — it silently never runs.
    defaults:
      run:
        working-directory: cloakline
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch:     amd64
            goos:     windows
            goarch:   amd64
            ext:      .exe
            archive:  zip
          - platform: macos
            arch:     amd64
            goos:     darwin
            goarch:   amd64
            ext:      ""
            archive:  tar.gz
          - platform: macos
            arch:     arm64
            goos:     darwin
            goarch:   arm64
            ext:      ""
            archive:  tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cloakline/go.mod
          cache: true

      - name: Build cloak(line)
        env:
          GOOS:   ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist/bin
          # Stamp version/commit/build-time into the daemon so every log line
          # carries the build identity (cmd/cloakline/buildinfo.go). This is
          # what lets a pasted log prove which release is actually running.
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          STAMP="-X main.version=${{ github.ref_name }} -X main.commit=${{ github.sha }} -X main.buildTime=${BUILD_TIME}"
          go build -trimpath -ldflags="-s -w ${STAMP}" -o "dist/bin/cloakline${{ matrix.ext }}" ./cmd/cloakline
          go build -trimpath -ldflags="-s -w"          -o "dist/bin/cloak${{ matrix.ext }}"     ./cmd/cloak

      - name: Assemble release layout
        run: |
          # Layout the archive so that after extraction the paths line up
          # with what bootstrap.ps1 / bootstrap.sh expect (repo-root/bin,
          # repo-root/scripts, repo-root/configs).
          mkdir -p dist/scripts dist/configs
          cp -r scripts/*.ps1 scripts/*.sh dist/scripts/  || true
          cp -r configs/*.yaml dist/configs/              || true
          cp README.md LICENSE dist/ 2>/dev/null          || true
          echo "cloakline release ${{ github.ref_name }}" > dist/VERSION
          ls -R dist

      - name: Pack (zip)
        if: matrix.archive == 'zip'
        run: |
          cd dist
          zip -r "../cloakline-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.arch }}.zip" .
          cd ..

      - name: Pack (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          tar -C dist -czf "cloakline-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" .

      - name: Compute checksum
        run: |
          for f in cloakline-${{ github.ref_name }}-*.${{ matrix.archive }}; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.arch }}
          # Resolved from the workspace root, unlike `run` steps — the archives
          # are written in cloakline/ because that is the working directory.
          path: |
            cloakline/cloakline-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive }}
            cloakline/cloakline-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive }}.sha256
          retention-days: 30

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dist-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Any tag carrying a pre-release suffix must be published as a
          # prerelease. This is not cosmetic: npm/lib/install.js defaults to
          # resolving GitHub's releases/latest endpoint, and that endpoint
          # excludes prereleases but nothing else. A candidate published as a
          # normal release therefore becomes what `npx cloakline` installs.
          #
          # Found by tagging v0.2.2-rc1 to test this workflow — it published
          # green, and promptly became the latest release ahead of v0.2.1.
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
