name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch:     amd64
            goos:     windows
            goarch:   amd64
            ext:      .exe
            archive:  zip
          - platform: macos
            arch:     amd64
            goos:     darwin
            goarch:   amd64
            ext:      ""
            archive:  tar.gz
          - platform: macos
            arch:     arm64
            goos:     darwin
            goarch:   arm64
            ext:      ""
            archive:  tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build cloak(line)
        env:
          GOOS:   ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist/bin
          go build -trimpath -ldflags="-s -w" -o "dist/bin/cloakline${{ matrix.ext }}" ./cmd/cloakline
          go build -trimpath -ldflags="-s -w" -o "dist/bin/cloak${{ matrix.ext }}"     ./cmd/cloak

      - name: Assemble release layout
        run: |
          # Layout the archive so that after extraction the paths line up
          # with what bootstrap.ps1 / bootstrap.sh expect (repo-root/bin,
          # repo-root/scripts, repo-root/configs).
          mkdir -p dist/scripts dist/configs
          cp -r scripts/*.ps1 scripts/*.sh dist/scripts/  || true
          cp -r configs/*.yaml dist/configs/              || true
          cp README.md LICENSE dist/ 2>/dev/null          || true
          echo "cloakline release ${{ github.ref_name }}" > dist/VERSION
          ls -R dist

      - name: Pack (zip)
        if: matrix.archive == 'zip'
        run: |
          cd dist
          zip -r "../cloakline-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.arch }}.zip" .
          cd ..

      - name: Pack (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          tar -C dist -czf "cloakline-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" .

      - name: Compute checksum
        run: |
          for f in cloakline-${{ github.ref_name }}-*.${{ matrix.archive }}; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            cloakline-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive }}
            cloakline-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive }}.sha256
          retention-days: 30

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dist-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
