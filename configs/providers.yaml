schema_version: v1.0

providers:
  - id: openai-default
    kind: openai
    base_url: https://api.openai.com
    api_key_env: OPENAI_API_KEY   # actual value comes from environment
    model: gpt-4o-mini
    max_context: 128000
    cost_per_1k_in: 0.150
    cost_per_1k_out: 0.600
    local: false

  # Uncomment to enable Anthropic routing. Requires ANTHROPIC_API_KEY set.
  # - id: anthropic-default
