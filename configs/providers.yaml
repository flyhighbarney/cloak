schema_version: v1.0

providers:
  # Cloud OpenAI (commented for offline demo — uncomment when you have a real key).
  # - id: openai-default
  #   kind: openai
  #   base_url: https://api.openai.com
  #   api_key_env: OPENAI_API_KEY
  #   model: gpt-4o-mini
  #   max_context: 128000
  #   cost_per_1k_in: 0.150
  #   cost_per_1k_out: 0.600
  #   local: false

  # OFFLINE — Ollama running on this host.
  - id: ollama-local
    kind: openai
    base_url: http://localhost:11434
    api_key_env: OLLAMA_API_KEY
    model: llama3.2:1b
    max_context: 8192
    cost_per_1k_in: 0.0
    cost_per_1k_out: 0.0
    local: true

  # Uncomment to enable Anthropic routing. Requires ANTHROPIC_API_KEY set.
  # - id: anthropic-default
  #   kind: anthropic
  #   base_url: https://api.anthropic.com
  #   api_key_env: ANTHROPIC_API_KEY
  #   model: claude-3-5-sonnet-20241022
  #   max_context: 200000
  #   cost_per_1k_in: 3.00
  #   cost_per_1k_out: 15.00
  #   local: false

  # OFFLINE MODE — Ollama on localhost.
  # Ollama exposes an OpenAI-compatible endpoint at /v1/chat/completions,
  # so we register it as kind: openai with local: true so the SSRF client
  # permits loopback. No cloud API key needed; Ollama ignores the header
  # but we still populate api_key_env with a dummy so config validation passes.
  #
  # Install Ollama:  https://ollama.com/download
  # Pull a model:    ollama pull llama3.2
  # Set env var:     export OLLAMA_API_KEY=unused
  #
  # - id: ollama-local
  #   kind: openai
  #   base_url: http://localhost:11434
  #   api_key_env: OLLAMA_API_KEY
  #   model: llama3.2
  #   max_context: 8192
  #   cost_per_1k_in: 0.0
  #   cost_per_1k_out: 0.0
  #   local: true
