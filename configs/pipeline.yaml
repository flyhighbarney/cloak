schema_version: v1.0

# env: dev | prod. Prod tightens governance invariants (see docs/threat-model.md).
env: dev

# security: dev | permissive | strict. Prod requires strict.
security: dev

listen: ":4000"
admin_listen: ":4001"

max_body_bytes: 4194304    # 4 MiB
request_timeout_seconds: 30

# DLP action policy.
# Actions: allow | warn | redact | block
#   allow  - content passes unmodified
#   warn   - tokenizes AND emits a warning event (for audit)
#   redact - tokenizes silently; response is de-anonymized on the return path
#   block  - rejects the request with 403
injection:
  # Score threshold at which a request is blocked with 403.
  # Curated rule set; each rule contributes 15–45 points on match.
  # Default: 50 (single strong rule OR two moderate rules will block).
  threshold: 50

# Per-key rate limit. Zero disables. Token bucket algorithm.
rate_limit:
  requests_per_second: 10
  burst: 20

# Per-budget-ref daily request caps. Reset at UTC midnight.
# Principals reference these via principals.yaml → budget_ref.
budgets:
  default:
    daily_requests: 1000    # generous starter tier

dlp:
  # Default posture: tokenize personal data so the round-trip works
  # transparently. Credentials still block outright.
  default: redact
  actions:
    ssn: redact           # tokenize + restore on response
    credit_card: redact   # tokenize + restore on response
    email: redact         # tokenize + restore on response
    api_key: block        # credentials never leave the network
    private_key: block
    aws_key: block
    github_token: block

# Informational: DAG order is derived from Stage.Requires().
stages:
  - normalize
  - extract.text
  - dlp.tier1
  - reassemble
