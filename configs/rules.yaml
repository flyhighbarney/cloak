schema_version: v1.0

# Rules — the human-readable overlay on top of pipeline.yaml.
#
# Format:
#   - name: (optional) human title, shown in admin dashboard
#     if:   "detects <kind>" OR "injection_score >= N"
#     then: allow | warn | redact | block
#
# Kinds you can `detects`: ssn, credit_card, email, phone, person_name,
# api_key, private_key, github_token, aws_key, or any_pii for the default.
#
# Rules in this file OVERRIDE the dlp/injection sections in pipeline.yaml.
#
# Default posture: "paste anything, we tokenize" for PII (safe round-trip
# via the session vault). Credentials stay at block — a leaked credential
# is unrecoverable damage.

rules:
  # ---- Personal data: tokenize + restore on the response ----
  - name: "Tokenize US SSNs (round-trip via session vault)"
    if: detects ssn
    then: redact

  - name: "Tokenize credit card numbers"
    if: detects credit_card
    then: redact

  - name: "Tokenize emails"
    if: detects email
    then: redact

  - name: "Tokenize everything else that looks like PII"
    if: detects any_pii
    then: redact

  # ---- Credentials: never leave the network. Blocked outright. ----
  - name: "Block API keys and secrets"
    if: detects api_key
    then: block

  - name: "Block AWS access keys"
    if: detects aws_key
    then: block

  - name: "Block GitHub tokens"
    if: detects github_token
    then: block

  - name: "Block private keys"
    if: detects private_key
    then: block

  # ---- Guardrail against obvious model manipulation ----
  - name: "Block obvious model manipulation"
    if: injection_score >= 50
    then: block
